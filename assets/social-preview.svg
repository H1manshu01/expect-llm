<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <rect x="0" y="0" width="1280" height="640" fill="#0d1117"/>
  <rect x="0" y="0" width="1280" height="6" fill="#a371f7"/>

  <text x="80" y="250" font-size="70" font-weight="700" fill="#e6edf3">expect<tspan fill="#a371f7">-llm</tspan></text>
  <text x="82" y="304" font-size="25" fill="#c9d1d9">LLM output matchers for Vitest and Jest</text>
  <text x="82" y="340" font-size="19" fill="#8b949e">assert JSON, schema, content, structure</text>

  <g font-size="18" fill="#c9d1d9">
    <rect x="80" y="376" width="196" height="44" rx="22" fill="#161b22" stroke="#30363d"/>
    <text x="178" y="404" text-anchor="middle">zero-dependency</text>
    <rect x="288" y="376" width="176" height="44" rx="22" fill="#161b22" stroke="#30363d"/>
    <text x="376" y="404" text-anchor="middle">Vitest + Jest</text>
    <rect x="476" y="376" width="118" height="44" rx="22" fill="#161b22" stroke="#30363d"/>
    <text x="535" y="404" text-anchor="middle">~1.4 kB</text>
  </g>

  <text x="82" y="508" font-size="25"><tspan fill="#a371f7">$</tspan> <tspan fill="#c9d1d9">npm i -D expect-llm</tspan></text>

  <rect x="700" y="96" width="500" height="448" rx="14" fill="#010409" stroke="#30363d" stroke-width="1"/>
  <rect x="700" y="96" width="500" height="46" rx="14" fill="#161b22"/>
  <rect x="700" y="128" width="500" height="14" fill="#161b22"/>
  <circle cx="726" cy="119" r="6.5" fill="#ff5f56"/>
  <circle cx="748" cy="119" r="6.5" fill="#ffbd2e"/>
  <circle cx="770" cy="119" r="6.5" fill="#27c93f"/>
  <text x="975" y="124" text-anchor="middle" font-size="14" fill="#8b949e">output.test.ts · vitest run</text>

  <text x="724" y="190" font-size="15" fill="#6e7681">// assert model output, no eval platform</text>
  <text x="724" y="224" font-size="17"><tspan fill="#8b949e">expect.extend(</tspan><tspan fill="#a371f7">llmMatchers</tspan><tspan fill="#8b949e">)</tspan></text>

  <text x="724" y="266" font-size="16"><tspan fill="#8b949e">expect(out).</tspan><tspan fill="#a371f7">toBeValidJSON</tspan><tspan fill="#8b949e">()</tspan></text>
  <text x="1158" y="266" font-size="16" fill="#27c93f">✓</text>
  <text x="724" y="300" font-size="16"><tspan fill="#8b949e">expect(out).</tspan><tspan fill="#a371f7">toMatchSchema</tspan><tspan fill="#8b949e">(S)</tspan></text>
  <text x="1158" y="300" font-size="16" fill="#27c93f">✓</text>
  <text x="724" y="334" font-size="16"><tspan fill="#8b949e">expect(s).</tspan><tspan fill="#a371f7">toBeOneOf</tspan><tspan fill="#8b949e">(set)</tspan></text>
  <text x="1158" y="334" font-size="16" fill="#27c93f">✓</text>
  <text x="724" y="368" font-size="16"><tspan fill="#8b949e">expect(a).</tspan><tspan fill="#a371f7">toContainNone</tspan><tspan fill="#8b949e">(bad)</tspan></text>
  <text x="1158" y="368" font-size="16" fill="#27c93f">✓</text>

  <text x="724" y="404" font-size="15"><tspan fill="#27c93f">✓ 4 passed</tspan><tspan fill="#6e7681">  ·  0 model calls</tspan></text>
